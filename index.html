<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Uygulama Desteği -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIldhdGNoRG9nIFJlcG9zdCBUcmFja2VyIiwKICAic2hvcnRfbmFtZSI6ICJXYXRjaERvZyIsCiAgInN0YXJ0X3VybCI6ICIvIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvcIjogIiMwZjBmMTIiLAogICJ0aGVtZV9jb2xvcIjogIjg4MmJlMiIKfQ==">
    <title>WatchDog Repost Tracker</title>
    
    <!-- Firebase Veritabanı Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #0f0f12;
            --card-bg: #1a1a24;
            --accent: #8a2be2;
            --accent-hover: #9d4edd;
            --text: #ffffff;
            --subtext: #a0a0b0;
            --success: #00ffcc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid #2a2a3c;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; color: var(--accent); font-size: 22px; text-align: center; }
        p { color: var(--subtext); font-size: 14px; text-align: center; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--subtext); margin-bottom: 5px; }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #33334d;
            background: #101018;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: var(--accent-hover); }

        .hidden { display: none; }

        .link-box {
            background: #101018;
            border: 1px dashed var(--accent);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
            color: var(--success);
            text-align: center;
            margin-bottom: 15px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a3c;
            padding-bottom: 8px;
            margin-top: 20px;
        }

        .log-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .log-item {
            background: #12121c;
            border-left: 3px solid var(--accent);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .log-item .time {
            color: var(--success);
            font-weight: bold;
            font-size: 12px;
        }

        .log-item .device {
            color: var(--subtext);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <!-- 1. Ekran: Kurulum -->
    <div class="container" id="step-setup">
        <h2>WatchDog Tracker App</h2>
        <p>Instagram takip sistemini başlatın.</p>
        
        <div class="input-group">
            <label>Instagram Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="@kullanici_adi">
        </div>

        <div class="input-group">
            <label>Yönlendirilecek Instagram Gönderisi / Repost Linki</label>
            <input type="text" id="target-link" placeholder="https://instagram.com/p/...">
        </div>

        <button onclick="initTracker()">Uygulamayı Başlat ve Kur</button>
    </div>

    <!-- 2. Ekran: Canlı Takip Paneli -->
    <div class="container hidden" id="step-dashboard">
        <h2 id="user-title">@kullanici_adi Paneli</h2>
        <p>Aşağıdaki bağlantıyı Instagram Repost/Hikayenizde paylaşın:</p>

        <div class="link-box" id="generated-link">Link Üretiliyor...</div>

        <div class="log-header">
            <strong style="font-size: 14px;">Canlı Tıklama Akışı</strong>
            <span style="font-size: 11px; color: var(--success);">● Veritabanı & Bildirim Aktif</span>
        </div>

        <div class="log-list" id="log-container">
            <div style="text-align: center; color: var(--subtext); padding: 20px 0; font-size: 13px;" id="empty-msg">
                Tıklama bekleniyor... Tıklayanların zaman bilgisi anında buraya düşecek.
            </div>
        </div>
    </div>

    <script>
        // Ücretsiz Firebase Veritabanı Yapılandırması
        const firebaseConfig = {
            databaseURL: "https://watchdog-tracker-default-rtdb.firebaseio.com"
        };
        
        // Firebase Başlatma
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let currentUsername = "";
        let targetUrl = "https://instagram.com";

        // Yönlendirme (Köprü) kontrolü: Biri linke tıkladıysa
        const urlParams = new URLSearchParams(window.location.search);
        const trackerUser = urlParams.get('r');
        const redirectTarget = urlParams.get('go');

        if (trackerUser) {
            // SİTEYE TIKLAYAN KİŞİ BURAYA DÜŞER
            const now = new Date();
            const clickData = {
                time: now.toLocaleTimeString('tr-TR'),
                date: now.toLocaleDateString('tr-TR'),
                device: navigator.userAgent.includes("Android") ? "Android Cihaz" : 
                        navigator.userAgent.includes("iPhone") ? "iPhone / iOS" : "Masaüstü / Diğer"
            };

            // Veritabanına kaydet ve doğrudan Instagram'a fırlat
            database.ref('clicks/' + trackerUser).push(clickData).then(() => {
                window.location.href = redirectTarget ? decodeURIComponent(redirectTarget) : "https://instagram.com";
            }).catch(() => {
                window.location.href = "https://instagram.com";
            });
        }

        // PANELİ BAŞLATMA (Uygulamayı Kullanan Kişi)
        function initTracker() {
            const user = document.getElementById("username").value.trim().replace("@", "");
            const customLink = document.getElementById("target-link").value.trim();

            if (!user) {
                alert("Lütfen bir kullanıcı adı girin!");
                return;
            }

            // Bildirim İzni İsteme
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            currentUsername = user;
            if (customLink) targetUrl = customLink;

            document.getElementById("step-setup").classList.add("hidden");
            document.getElementById("step-dashboard").classList.remove("hidden");
            document.getElementById("user-title").innerText = "@" + currentUsername + " Paneli";

            // Kullanıcıya özel izleme linki
            const shareableLink = window.location.origin + window.location.pathname + 
                                  "?r=" + encodeURIComponent(currentUsername) + 
                                  "&go=" + encodeURIComponent(targetUrl);

            document.getElementById("generated-link").innerText = shareableLink;

            // Veritabanını Canlı Dinle (Tıklama Geldikçe Ekrana Bas ve Bildirim Gönder)
            database.ref('clicks/' + currentUsername).on('child_added', (snapshot) => {
                const data = snapshot.val();
                
                // 1. Ekran paneline log ekle
                addLogToScreen(data.device, data.time, data.date);
                
                // 2. Sesli Bildirim Çal
                try {
                    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                    audio.play();
                } catch(e) {}

                // 3. Tablet Bildirim Paneline Düşür
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("WatchDog Tracker", {
                        body: `Yeni tıklama yakalandı! Saat: ${data.time} (${data.device})`
                    });
                }
            });
        }

        function addLogToScreen(device, time, date) {
            const emptyMsg = document.getElementById("empty-msg");
            if (emptyMsg) emptyMsg.remove();

            const logContainer = document.getElementById("log-container");
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `
                <div><strong>Erişim Yakalandı</strong></div>
                <div class="device">Cihaz: ${device}</div>
                <div class="time">Saat/Dakika: ${time} (${date})</div>
            `;
            logContainer.prepend(item);
        }
    </script>
</body>
</html>
