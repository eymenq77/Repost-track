<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repost Tracker</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background: #1a1a24;
            border: 1px solid #2a2a3c;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        h2 { color: #8a2be2; margin-top: 0; font-size: 20px; text-align: center; }
        p { color: #a0a0b0; font-size: 13px; text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background: #101018;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .link-box {
            background: #101018;
            border: 1px dashed #00ffcc;
            padding: 10px;
            border-radius: 6px;
            color: #00ffcc;
            font-size: 11px;
            word-break: break-all;
            margin: 10px 0;
            text-align: center;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="setup">
        <h2>Link Oluşturucu</h2>
        <p>Yönlendirilecek Instagram linkini girin:</p>
        <input type="text" id="target" placeholder="https://instagram.com/p/..." value="https://instagram.com">
        <button onclick="makeLink()">Takip Linki Üret</button>
    </div>

    <div class="card hidden" id="result">
        <h2>Linkiniz Hazır!</h2>
        <p>Bu linki kopyalayıp gönderin:</p>
        <div class="link-box" id="final-link"></div>
        <p style="font-size:11px; color:#ff4757;">⚠️ Linke tıklandığı an kesintisiz yönlendirme yapılacaktır.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('to');

        // BİRİ LİNKE TIKLADIĞINDA:
        if (targetUrl) {
            document.body.innerHTML = "<h3 style='color:white;text-align:center;'>Yönlendiriliyorsunuz...</h3>";
            let destination = decodeURIComponent(targetUrl);
            if (!destination.startsWith('http')) {
                destination = 'https://' + destination;
            }
            // Bekletmeden anında yönlendir
            window.location.href = destination;
        }

        // KENDİN LİNK ÜRETİRKEN:
        function makeLink() {
            let inputUrl = document.getElementById('target').value.trim();
            if (!inputUrl) inputUrl = "https://instagram.com";

            const baseUrl = window.location.origin + window.location.pathname;
            const createdLink = baseUrl + "?to=" + encodeURIComponent(inputUrl);

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('final-link').innerText = createdLink;
        }
    </script>
</body>
</html>
